name: plotora

services:
  postgis:
    image: postgis/postgis:17-3.6
    container_name: plotora-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - plotora_postgres_data:/var/lib/postgresql/data
    networks:
      - plotora_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  plotora_postgres_data:
    name: plotora_postgres_data

networks:
  plotora_network:
    name: plotora_network
