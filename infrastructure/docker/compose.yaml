name: plotora

services:
  postgis:
    image: postgis/postgis:17-3.6
    container_name: plotora-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - plotora_postgres_data:/var/lib/postgresql/data
    networks:
      - plotora_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: plotora-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgis
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      UPLOAD_DIR: /app/uploads
      JWT_ACCESS_MINUTES: 720
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - plotora_network
    volumes:
      - plotora_uploads:/app/uploads

  mailpit:
    image: axllent/mailpit:latest
    container_name: plotora-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - plotora_network

volumes:
  plotora_postgres_data:
    name: plotora_postgres_data
  plotora_uploads:
    name: plotora_uploads

networks:
  plotora_network:
    name: plotora_network
