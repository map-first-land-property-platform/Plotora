name: plotora

services:
  postgis:
    image: postgis/postgis:17-3.6
    container_name: plotora-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - plotora_postgres_data:/var/lib/postgresql/data
    networks:
      - plotora_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: plotora-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgis
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@plotora.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me-12345}
      MAIL_QUEUE_SECRET: ${MAIL_QUEUE_SECRET:-dev-only-recovery-mail-secret-change-me-12345}
      RECOVERY_PRODUCTION: ${RECOVERY_PRODUCTION:-false}
      UPLOAD_DIR: /app/uploads
      JWT_ACCESS_MINUTES: 720
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - plotora_network
    volumes:
      - plotora_uploads:/app/uploads

  mailpit:
    image: axllent/mailpit:latest
    container_name: plotora-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - plotora_network

volumes:
  plotora_postgres_data:
    name: plotora_postgres_data
  plotora_uploads:
    name: plotora_uploads

networks:
  plotora_network:
    name: plotora_network
