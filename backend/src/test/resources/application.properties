spring.datasource.url=jdbc:h2:mem:plotora_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.jwt.secret=test-only-jwt-secret-with-at-least-32-bytes
app.jwt.access-minutes=15
app.jwt.refresh-days=7
app.cookie.secure=false
app.cors.allowed-origin=http://localhost:3000
app.web.base-url=http://localhost:3000
app.mail.from=no-reply@example.test
spring.mail.host=localhost
spring.mail.port=25
